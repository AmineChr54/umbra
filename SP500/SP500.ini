[Rainmeter]
Update=1000
AccurateText=1
LeftMouseUpAction=["https://finance.yahoo.com/quote/%5EGSPC"]
ContextTitle=Open chart on Yahoo Finance
ContextAction=["https://finance.yahoo.com/quote/%5EGSPC"]

[Metadata]
Name=S&P 500
Author=AmineChr54
Version=2.0
Information=Live S&P 500 index card: price, change, percent and an intraday sparkline.
License=MIT

[Variables]
RefreshSeconds=60
Font=Segoe UI Variable Display

; ---- 1) DATA: ONE HTTP request, the whole JSON body is handed to Lua ----
[mFeed]
Measure=WebParser
URL=https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=1d&interval=5m
UserAgent=Mozilla/5.0
UpdateRate=#RefreshSeconds#
RegExp=(?s)^(.*)$

[mBody]
Measure=WebParser
URL=[mFeed]
StringIndex=1

; ---- 2) LOGIC: parsing, math, colors and the sparkline path live in Lua ----
[mScript]
Measure=Script
ScriptFile=#CURRENTPATH#SP500.lua

; ---- 3) VIEW ----
[Card]
Meter=Shape
Shape=Rectangle 0,0,300,160,18 | Fill LinearGradient CardGrad | StrokeWidth 1 | Stroke Color 255,255,255,28
CardGrad=90 | 28,31,42,235 ; 0.0 | 14,15,21,235 ; 1.0

[Title]
Meter=String
Text=S&P 500
X=20
Y=16
FontFace=#Font#
FontSize=10
FontWeight=700
FontColor=235,238,245,255
AntiAlias=1

[Sub]
Meter=String
Text=^GSPC  |  INDEX
X=76
Y=17
FontFace=#Font#
FontSize=8
FontColor=130,136,150,255
AntiAlias=1

[Price]
Meter=String
Text=--
X=20
Y=36
FontFace=#Font#
FontSize=24
FontWeight=700
FontColor=245,247,250,255
AntiAlias=1

[PillBg]
Meter=Shape
Shape=Rectangle 206,40,76,26,13 | Fill Color 120,120,120,50 | StrokeWidth 0
DynamicVariables=1

[Pct]
Meter=String
Text=--
X=244
Y=44
FontFace=#Font#
FontSize=10
FontWeight=700
FontColor=170,170,170,255
StringAlign=Center
AntiAlias=1

[Chg]
Meter=String
Text=
X=282
Y=72
FontFace=#Font#
FontSize=9
FontColor=170,170,170,255
StringAlign=Right
AntiAlias=1

[Spark]
Meter=Shape
Shape=Path RefPath | StrokeWidth 1 | Stroke Color 255,255,255,35
Shape2=Path AreaPath | Fill LinearGradient AreaGrad | StrokeWidth 0
Shape3=Path LinePath | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color 170,170,170,255 | StrokeLineJoin Round
RefPath=20,100 | LineTo 280,100
AreaPath=20,140 | LineTo 280,140 | ClosePath 1
AreaGrad=90 | 170,170,170,90 ; 0.0 | 170,170,170,0 ; 1.0
LinePath=20,120 | LineTo 280,120

[Updated]
Meter=String
Text=loading...
X=20
Y=142
FontFace=#Font#
FontSize=7
FontColor=95,100,115,255
AntiAlias=1
