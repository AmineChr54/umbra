[Rainmeter]
Update=1000
AccurateText=1
LeftMouseUpAction=["https://finance.yahoo.com/quote/%5EGSPC"]
ContextTitle=Open chart on Yahoo Finance
ContextAction=["https://finance.yahoo.com/quote/%5EGSPC"]

[Metadata]
Name=S&P 500
Author=AmineChr54
Version=2.1
Information=Live S&P 500 index card: price, change, percent and a smooth intraday sparkline.
License=MIT

[Variables]
RefreshSeconds=60
Font=Segoe UI Variable Display

; ---- 1) DATA: ONE HTTP request, the whole JSON body is handed to Lua ----
[mFeed]
Measure=WebParser
URL=https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=1d&interval=5m
UserAgent=Mozilla/5.0
UpdateRate=#RefreshSeconds#
RegExp=(?s)^(.*)$

[mBody]
Measure=WebParser
URL=[mFeed]
StringIndex=1

; ---- 2) LOGIC: parsing, math, colors and the sparkline path live in Lua ----
[mScript]
Measure=Script
ScriptFile=#CURRENTPATH#SP500.lua

; ---- 3) VIEW ----
[Card]
Meter=Shape
Shape=Rectangle 0.5,0.5,319,181,22 | Fill LinearGradient CardGrad | StrokeWidth 1 | Stroke Color 255,255,255,34
CardGrad=90 | 14,15,19,255 ; 0.0 | 0,0,0,255 ; 1.0

[Title]
Meter=String
Text=S&P 500
X=22
Y=16
FontFace=#Font#
FontSize=11
FontWeight=600
FontColor=235,238,245,255
AntiAlias=1

[Sub]
Meter=String
Text=^GSPC  |  INDEX
X=84
Y=18
FontFace=#Font#
FontSize=9
FontColor=150,156,172,255
AntiAlias=1

[Price]
Meter=String
Text=--
X=22
Y=38
FontFace=#Font#
FontSize=29
FontWeight=600
FontColor=245,247,250,255
AntiAlias=1

[PillBg]
Meter=Shape
Shape=Rectangle 214,44,84,30,15 | Fill Color 120,120,120,45 | StrokeWidth 0

[Pct]
Meter=String
Text=--
X=256
Y=49
FontFace=#Font#
FontSize=11
FontWeight=700
FontColor=170,170,170,255
StringAlign=Center
AntiAlias=1

[Chg]
Meter=String
Text=
X=298
Y=84
FontFace=#Font#
FontSize=10
FontColor=170,170,170,255
StringAlign=Right
AntiAlias=1

[Spark]
Meter=Shape
Shape=Path RefPath | StrokeWidth 1 | Stroke Color 255,255,255,35
Shape2=Path AreaPath | Fill LinearGradient AreaGrad | StrokeWidth 0
Shape3=Path LinePath | Fill Color 0,0,0,0 | StrokeWidth 2.5 | Stroke Color 170,170,170,255
RefPath=22,130 | LineTo 298,130
AreaPath=22,156 | LineTo 298,156 | ClosePath 1
AreaGrad=90 | 170,170,170,100 ; 0.0 | 170,170,170,0 ; 1.0
LinePath=22,140 | LineTo 298,140

