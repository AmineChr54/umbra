name: Bug report
description: Something in Umbra or a widget doesn't work
labels: ["type: bug", "status: triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings > My widgets
        2. Change the symbol to ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Umbra version
      description: Settings > About, or run `umbractl status`
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display scaling
      placeholder: "Windows 11 24H2, 2880x1620 at 200%"
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Last lines of `%APPDATA%\Umbra\umbra.log` (or `umbractl logs 30`). Remove anything private.
      render: text
