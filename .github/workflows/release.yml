name: Release

# Push a tag vX.Y.Z (matching Directory.Build.props) to build the installer and publish the GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG does not match Directory.Build.props version $v" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Unit tests
        run: dotnet test Umbra.slnx -c Release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: ./build.ps1

      - name: Publish release
        shell: pwsh
        run: |
          $setup = "dist/UmbraSetup-$env:VERSION.exe"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:TAG $setup --clobber }
          else { gh release create $env:TAG $setup --title "Umbra $env:VERSION" --generate-notes }
