name: Release

# Push a tag vX.Y.Z (matching Directory.Build.props) to build the installer and publish the GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG does not match Directory.Build.props version $v" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Unit tests
        run: dotnet test Umbra.slnx -c Release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: ./build.ps1

      # Code signing needs a certificate we may not have yet: skip cleanly unless both secrets are set.
      - name: Check signing secrets
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          $ok = $env:SIGN_CERT_BASE64 -and $env:SIGN_CERT_PASSWORD
          "SIGN=$($ok.ToString().ToLower())" >> $env:GITHUB_ENV
          if (-not $ok) { Write-Host "SIGN_CERT_BASE64 / SIGN_CERT_PASSWORD not set: publishing an unsigned installer" }

      - name: Sign installer
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          try {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SIGN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 /d "Umbra" "dist/UmbraSetup-$env:VERSION.exe"
            if ($LASTEXITCODE) { throw "signtool sign failed" }
            & $signtool.FullName verify /pa "dist/UmbraSetup-$env:VERSION.exe"
            if ($LASTEXITCODE) { throw "signature did not verify" }
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }

      - name: Fill winget manifests
        shell: pwsh
        run: ./scripts/winget.ps1 -Installer "dist/UmbraSetup-$env:VERSION.exe" -Version $env:VERSION -Out dist/winget

      - name: Publish release
        shell: pwsh
        run: |
          $setup = "dist/UmbraSetup-$env:VERSION.exe"
          $portable = "dist/Umbra-$env:VERSION-portable.zip"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:TAG $setup $portable --clobber }
          else { gh release create $env:TAG $setup $portable --title "Umbra $env:VERSION" --generate-notes }

      # Attach the filled manifests to the run; submit them to microsoft/winget-pkgs (see CONTRIBUTING.md).
      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ env.VERSION }}
          path: dist/winget/${{ env.VERSION }}
