name: Widgets

# Pull requests: validate every widget folder.
# Merges to main: regenerate widgets/index.json so new widgets appear in Umbra's Browse page.
on:
  pull_request:
    paths: ["widgets/**", "scripts/catalog.mjs"]
  push:
    branches: [main]
    paths: ["widgets/**", "scripts/catalog.mjs"]

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate widgets
        run: node scripts/catalog.mjs

  publish-catalog:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build catalog
        run: node scripts/catalog.mjs
      - name: Commit index.json if it changed
        run: |
          if git diff --quiet -- widgets/index.json; then
            echo "Catalog already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add widgets/index.json
            git commit -m "Update widget catalog"
            git push
          fi
