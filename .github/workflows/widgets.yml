name: Widgets

# Pull requests: validate every widget and theme folder, check that the committed indexes
# (widgets/index.json, themes/index.json) match them, and check that changed folders bump their version.
# Nothing is committed from CI: main is protected, so PR authors run `node scripts/catalog.mjs` and commit the result.
on:
  pull_request:
    paths: ["widgets/**", "themes/**", "scripts/catalog.mjs", "scripts/check-bump.mjs"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate widgets and themes, and check the indexes are up to date
        run: node scripts/catalog.mjs --check
      - name: Changed widgets and themes bump their version
        run: node scripts/check-bump.mjs origin/${{ github.base_ref }}
