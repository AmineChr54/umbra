name: Project board

# New issues and PRs: label for triage and add them to the "Umbra Roadmap" board.
# Adding to a user-owned board needs a token with the "project" scope, stored as the PROJECT_TOKEN secret.
# Without that secret the add step is skipped; turning on the board's built-in "Auto-add to project"
# workflow does the same job. Closed or merged items are moved to Done by the board's built-in workflows.
on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Label new issues for triage
        if: github.event_name == 'issues'
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUMBER" -R "$GITHUB_REPOSITORY" --add-label "status: triage"

      - name: Add to the Umbra Roadmap board
        if: env.PROJECT_TOKEN != ''
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/AmineChr54/projects/5
          github-token: ${{ secrets.PROJECT_TOKEN }}
