name: CI

# Every PR and every push to main: build (warnings are errors), unit tests, widget catalog validation.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: dotnet build Umbra.slnx -c Release -warnaserror
      - name: Unit tests
        run: dotnet test Umbra.slnx -c Release --no-build --logger "console;verbosity=normal"
      - name: Widget parser tests
        run: node --test tests/widgets/internships.test.mjs
      - name: Validate widgets
        # Validation only: widgets/index.json is regenerated on merge by widgets.yml, so PRs need not touch it.
        run: node scripts/catalog.mjs
