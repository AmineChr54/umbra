<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget stopped</title>
<link rel="stylesheet" href="umbra.css">
<style>
  body { display: grid; place-items: center; height: 100vh; margin: 0; text-align: center; font-family: var(--font); }
  main { padding: 16px; }
  h1 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  p { margin: 0 0 14px; font-size: 12px; color: var(--text-2); }
  button { font: inherit; font-size: 12px; color: var(--text); background: var(--surface-3); border: 1px solid var(--line-strong);
           border-radius: var(--radius-s); padding: 6px 14px; cursor: pointer; }
  button:hover { background: var(--accent-soft); border-color: var(--accent); }
</style>
</head>
<body>
<!-- Shown by the host (WidgetWindow) after a widget's renderer crashed too often. It runs no widget code. -->
<main>
  <h1>This widget stopped working</h1>
  <p>Its page kept crashing, so Umbra stopped reloading it.</p>
  <button id="reload" type="button">Reload</button>
</main>
<script src="bridge.js"></script>
<script>
  document.getElementById("reload").addEventListener("click", () => window.umbraBridge && window.umbraBridge.post({ type: "reload" }));
</script>
</body>
</html>
