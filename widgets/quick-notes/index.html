<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quick Notes</title>
  <link rel="stylesheet" href="https://umbra.local/shared/umbra.css">
  <link rel="stylesheet" href="notes.css">
</head>
<body>
  <main class="notes">
    <nav class="tabs" id="tabs" data-no-drag></nav>
    <div id="text" class="editor" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="Note" data-ph="Type a note..."></div>
    <footer class="foot"><span id="status">Saved</span><span class="num" id="count">0 characters</span></footer>
  </main>
  <script src="https://umbra.local/shared/umbra.js"></script>
  <script src="notes.js"></script>
</body>
</html>
