<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weather</title>
  <link rel="stylesheet" href="https://umbra.local/shared/umbra.css">
  <link rel="stylesheet" href="weather.css">
</head>
<body>
  <main class="wx" id="app" hidden>
    <div class="top">
      <div class="city" id="city"></div>
      <div class="stale" id="stale" hidden>offline</div>
    </div>
    <div class="mid">
      <svg class="icon" id="icon" viewBox="0 0 48 48" aria-hidden="true"></svg>
      <div class="temp num" id="temp"></div>
    </div>
    <div class="cond" id="cond"></div>
    <div class="meta num">
      <span id="hl"></span>
      <span id="feels"></span>
    </div>
  </main>
  <div class="msg" id="msg">Loading</div>

  <script src="https://umbra.local/shared/umbra.js"></script>
  <script src="weather.js"></script>
</body>
</html>
