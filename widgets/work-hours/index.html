<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Work Hours</title>
  <link rel="stylesheet" href="https://umbra.local/shared/umbra.css">
  <link rel="stylesheet" href="work.css">
</head>
<body>
  <main class="wh" id="app">
    <header class="head">
      <button class="nav" id="prev" type="button" aria-label="Previous week" title="Previous week" data-no-drag>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg>
      </button>
      <button class="week num" id="week" type="button" title="Back to this week" data-no-drag>This week</button>
      <button class="nav" id="next" type="button" aria-label="Next week" title="Next week" data-no-drag>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg>
      </button>
      <span class="grow"></span>
      <button class="icon" id="copy" type="button" title="Copy this week's timesheet" aria-label="Copy this week's timesheet" data-no-drag>
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6"/><path d="M10.5 5.5V4A1.5 1.5 0 0 0 9 2.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5"/></svg>
      </button>
      <button class="icon" id="hist" type="button" title="Earlier weeks" aria-label="Earlier weeks" aria-pressed="false" data-no-drag>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5h11M4.5 11V8M8 11V4.5M11.5 11V6.5"/></svg>
      </button>
    </header>

    <section class="main" id="main">
      <div class="hero">
        <div class="ring" id="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r="52"/>
            <circle class="arc" id="arc" cx="60" cy="60" r="52"/>
            <circle class="arc over" id="arc-over" cx="60" cy="60" r="52"/>
          </svg>
          <div class="ring-c">
            <div class="worked num" id="worked">0:00</div>
            <div class="of num" id="of">of 20h</div>
          </div>
        </div>
        <div class="facts">
          <div class="left num" id="left">20h to go</div>
          <div class="pace num" id="pace"></div>
          <div class="carry num" id="carry" hidden></div>
        </div>
      </div>

      <div class="timer" id="timer" data-no-drag>
        <input class="note" id="note" type="text" maxlength="120" placeholder="What are you working on?" autocomplete="off" spellcheck="false">
        <div class="timer-row">
          <button class="since num" id="since" type="button" title="Change when this timer started" hidden></button>
          <span class="clock num" id="clock">0:00:00</span>
          <button class="discard" id="discard" type="button" title="Discard this timer" aria-label="Discard this timer" hidden>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
          </button>
          <button class="go" id="go" type="button">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.6v12.8a1 1 0 0 0 1.5.86l10.6-6.4a1 1 0 0 0 0-1.72L10 4.74a1 1 0 0 0-1.5.86z"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.2"/></svg>
            <span id="go-label">Start</span>
          </button>
        </div>
      </div>

      <div class="days" id="days" data-no-drag></div>

      <div class="day-head">
        <span class="day-title" id="day-title">Today</span>
        <span class="day-total num" id="day-total"></span>
        <button class="add" id="add" type="button" data-no-drag>+ Add time</button>
      </div>
      <div class="entries" id="entries" data-no-drag></div>
    </section>

    <section class="history" id="history" data-no-drag hidden></section>

    <!-- Entry editor: a sheet over the widget -->
    <div class="sheet" id="sheet" data-no-drag hidden>
      <form class="card" id="form" autocomplete="off">
        <div class="sheet-title" id="sheet-title">Add time</div>
        <label class="field"><span>Day</span><input type="date" id="f-date" required></label>
        <div class="two">
          <label class="field"><span>Start</span><input type="time" id="f-start" required></label>
          <label class="field" id="f-end-wrap"><span>End</span><input type="time" id="f-end"></label>
        </div>
        <label class="field" id="f-dur-wrap"><span>or how long</span><input type="text" id="f-dur" class="num" placeholder="e.g. 1:30, 2h, 45m"></label>
        <label class="field" id="f-note-wrap"><span>Note</span><input type="text" id="f-note" maxlength="120" placeholder="Optional"></label>
        <p class="err" id="f-err" hidden></p>
        <div class="actions">
          <button type="button" class="btn danger" id="f-del" hidden>Delete</button>
          <span class="grow"></span>
          <button type="button" class="btn" id="f-cancel">Cancel</button>
          <button type="submit" class="btn primary" id="f-save">Save</button>
        </div>
      </form>
    </div>

    <div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button type="button" id="toast-act" data-no-drag></button></div>
  </main>
  <script src="https://umbra.local/shared/umbra.js"></script>
  <script src="hours.js"></script>
  <script src="work.js"></script>
</body>
</html>
