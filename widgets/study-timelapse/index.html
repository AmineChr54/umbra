<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Study Time-Lapse</title>
  <link rel="stylesheet" href="https://umbra.local/shared/umbra.css">
  <link rel="stylesheet" href="study.css">
</head>
<body>
  <main class="st" id="app">
    <header class="head">
      <h1 class="title" id="title">Study Time-Lapse</h1>
      <span class="pill" id="pill" data-state="idle"><i></i><span id="pill-text">Idle</span></span>
    </header>

    <section class="body" id="body"></section>

    <footer class="actions" data-no-drag>
      <button class="btn primary" id="toggle">Start session</button>
      <button class="btn" id="render">Open renderer</button>
      <button class="btn ghost" id="setup" title="One-time setup">Setup</button>
    </footer>
  </main>
  <script src="https://umbra.local/shared/umbra.js"></script>
  <script src="study.js"></script>
</body>
</html>
